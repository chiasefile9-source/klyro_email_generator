<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klyro Email Generator — Công Cụ Tạo Email Chuyên Nghiệp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        klyro: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .tab-active {
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        .preview-frame-desktop {
            width: 100%;
            max-width: 660px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .preview-frame-mobile {
            width: 100%;
            max-width: 390px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Top Navigation / Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="https://ww.klyro.gt.tc/" target="_blank" rel="noopener" class="flex items-center gap-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 via-violet-600 to-blue-600 flex items-center justify-center text-white font-display font-extrabold text-lg shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                        K
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-display font-bold text-lg tracking-tight text-slate-900">Klyro</span>
                            <span class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">Email Studio</span>
                        </div>
                        <p class="text-xs text-slate-500 hidden sm:block">Hệ thống tạo mẫu email chăm sóc khách hàng</p>
                    </div>
                </a>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <a href="https://ww.klyro.gt.tc/" target="_blank" rel="noopener" class="hidden md:inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors">
                    <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                    ww.klyro.gt.tc
                </a>
                <button onclick="saveDefaults()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200/80 px-3.5 py-2 rounded-xl transition-all active:scale-95" title="Lưu thông tin ngân hàng & chữ ký vào trình duyệt">
                    <i data-lucide="bookmark-check" class="w-3.5 h-3.5 text-indigo-600"></i>
                    <span>Lưu cấu hình mặc định</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Template Selector Tabs (5 Mẫu Email) -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">1. Chọn loại mẫu Email cần gửi</label>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5" id="templateTabs">
                <button type="button" data-template="confirm" onclick="selectTemplate('confirm')" class="template-btn tab-active flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 bg-white text-left transition-all hover:border-indigo-300">
                    <span class="w-8 h-8 rounded-lg bg-blue-500/15 text-blue-600 flex items-center justify-center shrink-0 icon-box">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                    </span>
                    <div class="min-w-0">
                        <div class="text-xs font-bold truncate">Xác nhận đơn</div>
                        <div class="text-[11px] opacity-80 truncate">Tiếp nhận yêu cầu</div>
                    </div>
                </button>

                <button type="button" data-template="hold" onclick="selectTemplate('hold')" class="template-btn flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 bg-white text-slate-700 text-left transition-all hover:border-amber-300">
                    <span class="w-8 h-8 rounded-lg bg-amber-500/15 text-amber-600 flex items-center justify-center shrink-0 icon-box">
                        <i data-lucide="pause-circle" class="w-4 h-4"></i>
                    </span>
                    <div class="min-w-0">
                        <div class="text-xs font-bold truncate">Tạm hoãn đơn</div>
                        <div class="text-[11px] opacity-75 truncate">Kèm mục lý do</div>
                    </div>
                </button>

                <button type="button" data-template="completed" onclick="selectTemplate('completed')" class="template-btn flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 bg-white text-slate-700 text-left transition-all hover:border-emerald-300">
                    <span class="w-8 h-8 rounded-lg bg-emerald-500/15 text-emerald-600 flex items-center justify-center shrink-0 icon-box">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                    </span>
                    <div class="min-w-0">
                        <div class="text-xs font-bold truncate">Đơn đã thành công</div>
                        <div class="text-[11px] opacity-75 truncate">Bàn giao sản phẩm</div>
                    </div>
                </button>

                <button type="button" data-template="payment_request" onclick="selectTemplate('payment_request')" class="template-btn flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 bg-white text-slate-700 text-left transition-all hover:border-rose-300">
                    <span class="w-8 h-8 rounded-lg bg-rose-500/15 text-rose-600 flex items-center justify-center shrink-0 icon-box">
                        <i data-lucide="credit-card" class="w-4 h-4"></i>
                    </span>
                    <div class="min-w-0">
                        <div class="text-xs font-bold truncate">Yêu cầu thanh toán</div>
                        <div class="text-[11px] opacity-75 truncate">Gửi QR / Chuyển khoản</div>
                    </div>
                </button>

                <button type="button" data-template="payment_received" onclick="selectTemplate('payment_received')" class="template-btn col-span-2 sm:col-span-1 flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 bg-white text-slate-700 text-left transition-all hover:border-teal-300">
                    <span class="w-8 h-8 rounded-lg bg-teal-500/15 text-teal-600 flex items-center justify-center shrink-0 icon-box">
                        <i data-lucide="badge-dollar-sign" class="w-4 h-4"></i>
                    </span>
                    <div class="min-w-0">
                        <div class="text-xs font-bold truncate">Đã nhận thanh toán</div>
                        <div class="text-[11px] opacity-75 truncate">Xác nhận giao dịch</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Workspace Split Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Column: Dynamic Input Form (5 cols) -->
            <div class="lg:col-span-5 space-y-5">
                <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-5">
                    <div class="flex items-center justify-between pb-3.5 mb-4 border-b border-slate-100">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                            <h2 class="font-display font-bold text-sm text-slate-800">2. Thông tin đơn hàng & Khách hàng</h2>
                        </div>
                        <button type="button" onclick="resetDemoData()" class="text-xs text-slate-400 hover:text-indigo-600 font-medium transition-colors">
                            Điền mẫu thử
                        </button>
                    </div>

                    <div class="space-y-4">
                        <!-- Customer Name & Email -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Tên khách hàng *</label>
                                <input type="text" id="customerName" value="Minh Anh" oninput="renderEmail()" placeholder="VD: Nguyễn Minh Anh" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Email khách hàng</label>
                                <input type="email" id="customerEmail" value="minhanh.design@gmail.com" oninput="renderEmail()" placeholder="khachhang@gmail.com" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 outline-none transition-all">
                            </div>
                        </div>

                        <!-- Order ID & Service Package -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Mã đơn hàng *</label>
                                <div class="flex gap-1.5">
                                    <input type="text" id="orderId" value="KLY-261108" oninput="renderEmail()" class="w-full px-3 py-2 text-sm font-mono font-semibold text-indigo-700 bg-indigo-50/40 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 outline-none transition-all">
                                    <button type="button" onclick="generateOrderId()" title="Tạo mã đơn ngẫu nhiên" class="px-2.5 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 transition-colors shrink-0">
                                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Tổng giá trị đơn</label>
                                <input type="text" id="orderAmount" value="350.000đ" oninput="renderEmail()" placeholder="VD: 350.000đ" class="w-full px-3 py-2 text-sm font-semibold text-slate-800 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 outline-none transition-all">
                            </div>
                        </div>

                        <!-- Service Package -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Gói dịch vụ / Sản phẩm *</label>
                            <input type="text" id="serviceName" value="Thiết kế Slide Thuyết Trình Chuyên Nghiệp (15 Slides)" oninput="renderEmail()" placeholder="Tên gói dịch vụ của Klyro..." class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 outline-none transition-all">
                            <div class="flex flex-wrap gap-1.5 mt-1.5">
                                <button type="button" onclick="setQuickValue('serviceName', 'Gói Thiết Kế Slide Cơ Bản (10 Slides)')" class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition-colors">Slide Cơ Bản</button>
                                <button type="button" onclick="setQuickValue('serviceName', 'Gói Thiết Kế Slide Chuyên Nghiệp (15-20 Slides)')" class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition-colors">Slide Chuyên Nghiệp</button>
                                <button type="button" onclick="setQuickValue('serviceName', 'Thiết Kế Interactive HTML Slide Cao Cấp')" class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition-colors">HTML Slide</button>
                            </div>
                        </div>

                        <!-- DYNAMIC SECTION BASED ON TEMPLATE -->
                        <div id="dynamicFieldsContainer" class="pt-3 border-t border-slate-100 space-y-4">
                            <!-- Filled dynamically by JS -->
                        </div>

                        <!-- General Note -->
                        <div class="pt-2">
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Ghi chú bổ sung (Tùy chọn)</label>
                            <textarea id="extraNote" rows="2" oninput="renderEmail()" placeholder="Nhập lời nhắn riêng cho khách hàng nếu có..." class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 outline-none transition-all resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Sender & Brand Footer Config Card -->
                <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-5">
                    <details class="group">
                        <summary class="flex items-center justify-between cursor-pointer list-none">
                            <div class="flex items-center gap-2">
                                <i data-lucide="sliders-horizontal" class="w-4 h-4 text-indigo-600"></i>
                                <span class="font-display font-bold text-sm text-slate-800">Cấu hình thông tin Klyro & Thanh toán</span>
                            </div>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 group-open:rotate-180 transition-transform"></i>
                        </summary>
                        <div class="mt-4 pt-4 border-t border-slate-100 space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Thông tin tài khoản ngân hàng / Ví điện tử mặc định</label>
                                <textarea id="bankInfo" rows="3" oninput="renderEmail()" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-indigo-500 outline-none">Ngân hàng: MB Bank (Quân Đội)
Số tài khoản: 0987654321
Chủ tài khoản: KLYRO DESIGN STUDIO</textarea>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email hỗ trợ Klyro</label>
                                    <input type="text" id="brandEmail" value="chiasefile9@gmail.com" oninput="renderEmail()" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Website Klyro</label>
                                    <input type="text" id="brandWebsite" value="https://ww.klyro.gt.tc/" oninput="renderEmail()" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-indigo-500 outline-none">
                                </div>
                            </div>
                        </div>
                    </details>
                </div>
            </div>

            <!-- Right Column: Live Email Preview & Export Tools (7 cols) -->
            <div class="lg:col-span-7 space-y-4">
                
                <!-- Action Toolbar -->
                <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-4">
                    <!-- Subject Line Box -->
                    <div class="mb-3.5">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Tiêu đề Email (Subject)</span>
                            <button type="button" onclick="copySubject()" class="inline-flex items-center gap-1 text-xs font-semibold text-indigo-600 hover:text-indigo-700">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                Copy tiêu đề
                            </button>
                        </div>
                        <div id="subjectPreview" class="px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-sm font-semibold text-slate-800 select-all">
                            [Klyro] Xác nhận đơn hàng #KLY-261108 của bạn
                        </div>
                    </div>

                    <!-- Primary Action Buttons -->
                    <div class="flex flex-wrap items-center gap-2.5">
                        <button type="button" onclick="copyRichEmail()" class="flex-1 min-w-[200px] inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm shadow-indigo-600/20 transition-all active:scale-[0.99]">
                            <i data-lucide="clipboard-copy" class="w-4 h-4"></i>
                            <span>Sao chép Email (Dán vào Gmail)</span>
                        </button>

                        <button type="button" onclick="copyPlainText()" class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 text-xs font-semibold transition-all">
                            <i data-lucide="file-text" class="w-4 h-4 text-slate-600"></i>
                            <span>Copy Text thuần</span>
                        </button>

                        <button type="button" onclick="openInGmail()" class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200/70 text-xs font-semibold transition-all">
                            <i data-lucide="send" class="w-3.5 h-3.5"></i>
                            <span>Mở Gmail</span>
                        </button>

                        <button type="button" onclick="downloadHtmlFile()" class="inline-flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 text-xs font-semibold transition-all" title="Tải file mã nguồn HTML">
                            <i data-lucide="code-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Live Preview Container -->
                <div class="bg-slate-200/70 rounded-2xl border border-slate-300/70 overflow-hidden flex flex-col">
                    <!-- Browser / Email Client Top Bar -->
                    <div class="bg-white/90 backdrop-blur border-b border-slate-200 px-4 py-2.5 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                            </div>
                            <span class="text-xs font-semibold text-slate-500 ml-2">Xem trước giao diện Email</span>
                        </div>

                        <!-- Viewport Switcher -->
                        <div class="flex items-center gap-2">
                            <!-- Spacing Density Toggle -->
                            <div class="inline-flex rounded-lg bg-slate-100 p-0.5 border border-slate-200" title="Điều chỉnh khoảng cách dòng khi dán sang Gmail">
                                <button type="button" id="btnSpacingCompact" onclick="setSpacingMode('compact')" class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-semibold bg-white text-indigo-600 shadow-xs transition-all">
                                    <i data-lucide="align-justify" class="w-3 h-3"></i>
                                    <span>Gọn chuẩn Gmail</span>
                                </button>
                                <button type="button" id="btnSpacingRelaxed" onclick="setSpacingMode('relaxed')" class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-semibold text-slate-500 hover:text-slate-700 transition-all">
                                    <span>Thoáng</span>
                                </button>
                            </div>

                            <div class="inline-flex rounded-lg bg-slate-100 p-0.5 border border-slate-200">
                                <button type="button" id="btnDesktop" onclick="setViewport('desktop')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold bg-white text-indigo-600 shadow-xs transition-all">
                                    <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
                                    <span class="hidden sm:inline">Desktop</span>
                                </button>
                                <button type="button" id="btnMobile" onclick="setViewport('mobile')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-700 transition-all">
                                    <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
                                    <span class="hidden sm:inline">Mobile</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Email Render Stage -->
                    <div class="p-4 sm:p-6 overflow-x-auto flex justify-center bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:16px_16px]">
                        <div id="emailPreviewContainer" class="preview-frame-desktop bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200/80">
                            <!-- Rendered HTML Email will be injected here -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
        <div class="flex items-center gap-2.5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl border border-slate-700/80">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                <i data-lucide="check" class="w-4 h-4"></i>
            </div>
            <span id="toastMessage" class="text-xs font-semibold">Đã sao chép thành công!</span>
        </div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let currentTemplate = 'confirm';
        let spacingMode = 'compact'; // 'compact' (Gọn chuẩn Gmail) | 'relaxed' (Thoáng)

        // Default values for dynamic fields across templates
        const fieldState = {
            estimatedDelivery: 'Trong vòng 24 - 48 giờ làm việc kể từ lúc xác nhận',
            holdReason: 'Thiếu nội dung chi tiết hoặc tài liệu đính kèm cho các slide',

                        <div style="margin:0 0 6px 0;font-size:11.5px;color:#64748b;line-height:1.35;">Giải pháp thiết kế Slide &amp; Nội dung trực quan chuyên nghiệp</div>
                        <div style="margin:0;font-size:11.5px;color:#64748b;line-height:1.35;">
                            <a href="${escapeAttr(brandWebsite)}" target="_blank" style="color:#4f46e5;text-decoration:none;font-weight:600;">${escapeHtml(brandWebsite)}</a>
                            <span style="margin:0 6px;color:#cbd5e1;">•</span>
                            <a href="mailto:${escapeAttr(brandEmail)}" style="color:#4f46e5;text-decoration:none;font-weight:600;">${escapeHtml(brandEmail)}</a>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>`;

            return {
                subject: config.subject,
                html: html,
                customerEmail: customerEmail
            };
        }

        function setSpacingMode(mode) {
            spacingMode = mode;
            const btnCompact = document.getElementById('btnSpacingCompact');
            const btnRelaxed = document.getElementById('btnSpacingRelaxed');

            if (mode === 'compact') {
                btnCompact.classList.add('bg-white', 'text-indigo-600', 'shadow-xs');
                btnCompact.classList.remove('text-slate-500');
                btnRelaxed.classList.remove('bg-white', 'text-indigo-600', 'shadow-xs');
                btnRelaxed.classList.add('text-slate-500');
            } else {
                btnRelaxed.classList.add('bg-white', 'text-indigo-600', 'shadow-xs');
                btnRelaxed.classList.remove('text-slate-500');
                btnCompact.classList.remove('bg-white', 'text-indigo-600', 'shadow-xs');
                btnCompact.classList.add('text-slate-500');
            }
            renderEmail();
        }

                            <textarea rows="2" oninput="updateFieldState('holdActionRequired', this.value)" class="w-full px-3 py-2 text-sm bg-white rounded-xl border border-slate-200 focus:border-amber-500 outline-none">${escapeHtml(fieldState.holdActionRequired)}</textarea>

                `;
            } else if (currentTemplate === 'completed') {

                    <div class="p-3.5 rounded-xl bg-emerald-50/60 border border-emerald-200/80 space-y-3">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-800">
                            <i data-lucide="folder-check" class="w-3.5 h-3.5"></i>
                            <span>Thông tin Bàn giao sản phẩm</span>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Link nhận file / Canva / Google Drive *</label>
                            <input type="url" value="${escapeAttr(fieldState.deliveryLink)}" oninput="updateFieldState('deliveryLink', this.value)" placeholder="https://drive.google.com/..." class="w-full px-3 py-2 text-sm bg-white text-emerald-800 font-medium rounded-xl border border-emerald-300 focus:border-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Chính sách chỉnh sửa / Bảo hành</label>
                            <input type="text" value="${escapeAttr(fieldState.freeRevisions)}" oninput="updateFieldState('freeRevisions', this.value)" class="w-full px-3 py-2 text-sm bg-white rounded-xl border border-slate-200 focus:border-emerald-500 outline-none">
                        </div>
                    </div>
                `;
            } else if (currentTemplate === 'payment_request') {
                html = `
                    <div class="p-3.5 rounded-xl bg-rose-50/60 border border-rose-200/80 space-y-3">

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Số tiền cần thanh toán *</label>
                                <input type="text" value="${escapeAttr(fieldState.paymentDueAmount)}" oninput="updateFieldState('paymentDueAmount', this.value)" class="w-full px-3 py-2 text-sm bg-white font-bold text-rose-700 rounded-xl border border-rose-200 focus:border-rose-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Hạn thanh toán</label>
                                <input type="text" value="${escapeAttr(fieldState.paymentDeadline)}" oninput="updateFieldState('paymentDeadline', this.value)" class="w-full px-3 py-2 text-sm bg-white rounded-xl border border-slate-200 focus:border-rose-500 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Nội dung chuyển khoản</label>
                            <input type="text" value="${escapeAttr(fieldState.transferContent)}" oninput="updateFieldState('transferContent', this.value)" class="w-full px-3 py-2 text-sm font-mono font-bold bg-white text-slate-800 rounded-xl border border-slate-200 focus:border-rose-500 outline-none">

                    </div>
                `;
            } else if (currentTemplate === 'payment_received') {
                html = `
                    <div class="p-3.5 rounded-xl bg-teal-50/60 border border-teal-200/80 space-y-3">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-teal-800">

                                <label class="block text-xs font-semibold text-slate-700 mb-1">Số tiền đã nhận *</label>
                                <input type="text" value="${escapeAttr(fieldState.paidAmount)}" oninput="updateFieldState('paidAmount', this.value)" class="w-full px-3 py-2 text-sm bg-white font-bold text-teal-700 rounded-xl border border-teal-200 focus:border-teal-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Hình thức thanh toán</label>
                                <input type="text" value="${escapeAttr(fieldState.paymentMethod)}" oninput="updateFieldState('paymentMethod', this.value)" class="w-full px-3 py-2 text-sm bg-white rounded-xl border border-slate-200 focus:border-teal-500 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Tiến độ tiếp theo</label>
                            <textarea rows="2" oninput="updateFieldState('nextStepTimeline', this.value)" class="w-full px-3 py-2 text-sm bg-white rounded-xl border border-slate-200 focus:border-teal-500 outline-none">${escapeHtml(fieldState.nextStepTimeline)}</textarea>

            container.innerHTML = html;

        function updateFieldState(key, value) {
            fieldState[key] = value;
            renderEmail();
        }

        function selectHoldReason(reason) {
            fieldState.holdReason = reason;
            const input = document.getElementById('holdReasonInput');
            if (input) input.value = reason;
            renderEmail();
        }

        function setQuickValue(inputId, value) {
            const el = document.getElementById(inputId);
            if (el) {
                el.value = value;
                renderEmail();
            }
        }

        function generateOrderId() {
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const rand = Math.floor(100 + Math.random() * 900);
            const newId = `KLY-${yy}${mm}${rand}`;
            document.getElementById('orderId').value = newId;
            fieldState.transferContent = `${newId.replace('-', '')} THANH TOAN`;
            if (currentTemplate === 'payment_request') renderDynamicFields();
            renderEmail();
        }

        function renderEmail() {
            const data = getEmailData();
            document.getElementById('subjectPreview').textContent = data.subject;
            document.getElementById('emailPreviewContainer').innerHTML = data.html;
        }

        // --- VIEWPORT TOGGLE ---
        function setViewport(mode) {
            const container = document.getElementById('emailPreviewContainer');
            const btnDesktop = document.getElementById('btnDesktop');
            const btnMobile = document.getElementById('btnMobile');

            if (mode === 'mobile') {
                container.classList.remove('preview-frame-desktop');
                container.classList.add('preview-frame-mobile');
                btnMobile.classList.add('bg-white', 'text-indigo-600', 'shadow-xs');
                btnMobile.classList.remove('text-slate-500');
                btnDesktop.classList.remove('bg-white', 'text-indigo-600', 'shadow-xs');
                btnDesktop.classList.add('text-slate-500');
            } else {
                container.classList.remove('preview-frame-mobile');
                container.classList.add('preview-frame-desktop');
                btnDesktop.classList.add('bg-white', 'text-indigo-600', 'shadow-xs');
                btnDesktop.classList.remove('text-slate-500');
                btnMobile.classList.remove('bg-white', 'text-indigo-600', 'shadow-xs');
                btnMobile.classList.add('text-slate-500');
            }
        }

        // --- EXPORT & CLIPBOARD ACTIONS ---
        function getPlainTextVersion() {
            const data = getEmailData();
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = data.html;
            // Clean up whitespace while keeping structure readable
            return tempDiv.innerText.replace(/\n{3,}/g, '\n\n').trim();
        }

        async function copyRichEmail() {
            const data = getEmailData();
            const plainText = getPlainTextVersion();

            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    const htmlBlob = new Blob([data.html], { type: 'text/html' });
                    const textBlob = new Blob([plainText], { type: 'text/plain' });
                    const clipboardItem = new ClipboardItem({
                        'text/html': htmlBlob,
                        'text/plain': textBlob
                    });
                    await navigator.clipboard.write([clipboardItem]);
                    showToast('Đã sao chép Email định dạng đẹp! Hãy dán (Ctrl+V) vào Gmail.');
                    return;
                }
            } catch (err) {
                console.warn('ClipboardItem API fallback triggered:', err);
            }

            // Fallback selection copy for iFrame / older browsers
            try {
                const container = document.getElementById('emailPreviewContainer');
                const range = document.createRange();
                range.selectNodeContents(container);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                document.execCommand('copy');
                selection.removeAllRanges();
                showToast('Đã sao chép Email! Hãy dán (Ctrl+V) vào khung soạn thảo Gmail.');
            } catch (e) {
                showToast('Không thể sao chép tự động, vui lòng bôi đen khung xem trước.');
            }
        }

        function copyPlainText() {
            const text = getPlainTextVersion();
            copyTextToClipboard(text, 'Đã sao chép nội dung văn bản thuần!');
        }

        function copySubject() {
            const subject = document.getElementById('subjectPreview').textContent.trim();
            copyTextToClipboard(subject, 'Đã sao chép tiêu đề Email!');
        }

        function copyTextToClipboard(text, successMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg);
            } catch (err) {
                showToast('Lỗi khi sao chép văn bản.');
            }
            document.body.removeChild(textarea);
        }

        function openInGmail() {
            const data = getEmailData();
            const to = encodeURIComponent(data.customerEmail || '');
            const su = encodeURIComponent(data.subject);
            const body = encodeURIComponent(getPlainTextVersion());
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${su}&body=${body}`;
            window.open(gmailUrl, '_blank', 'noopener');
        }

        function downloadHtmlFile() {
            const data = getEmailData();
            const orderId = document.getElementById('orderId').value.trim() || 'klyro-email';
            const fullDoc = `<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>${escapeHtml(data.subject)}</title></head><body style="margin:0;padding:0;background:#f8fafc;">${data.html}</body></html>`;
            const blob = new Blob([fullDoc], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${orderId.toLowerCase()}-${currentTemplate}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Đã tải xuống file mã nguồn HTML!');
        }

        // --- LOCAL STORAGE DEFAULTS ---
        function saveDefaults() {
            const defaults = {
                bankInfo: document.getElementById('bankInfo').value,
                brandEmail: document.getElementById('brandEmail').value,
                brandWebsite: document.getElementById('brandWebsite').value
            };
            localStorage.setItem('klyro_email_defaults_v1', JSON.stringify(defaults));
            showToast('Đã lưu thông tin ngân hàng & thương hiệu Klyro!');
        }

        function loadSavedDefaults() {
            try {
                const raw = localStorage.getItem('klyro_email_defaults_v1');
                if (raw) {
                    const defaults = JSON.parse(raw);
                    if (defaults.bankInfo) document.getElementById('bankInfo').value = defaults.bankInfo;
                    if (defaults.brandEmail) document.getElementById('brandEmail').value = defaults.brandEmail;
                    if (defaults.brandWebsite) document.getElementById('brandWebsite').value = defaults.brandWebsite;
                }
            } catch (e) {
                console.warn('Could not load saved defaults', e);
            }
        }

        function resetDemoData() {
            document.getElementById('customerName').value = 'Trần Hoàng Nam';
            document.getElementById('customerEmail').value = 'hoangnam.work@gmail.com';
            generateOrderId();
            document.getElementById('orderAmount').value = '450.000đ';
            document.getElementById('serviceName').value = 'Gói Thiết Kế Slide Chuyên Nghiệp (20 Slides)';
            document.getElementById('extraNote').value = 'Cảm ơn bạn đã tin tưởng dịch vụ của Klyro!';
            renderEmail();
            showToast('Đã điền dữ liệu mẫu mới!');
        }

        // --- HELPERS ---
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            msgEl.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3200);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttr(str) {
            if (!str) return '';
            return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
